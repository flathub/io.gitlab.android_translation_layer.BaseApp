id: io.gitlab.android_translation_layer.BaseApp
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
build-options:
  append-path: /usr/lib/sdk/openjdk17/bin
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
# default command and finish-args only for using as commandline application. They are ignored when used as base app
command: android-translation-layer
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
cleanup:
  - /include
  - /bin/dx
  - '*.a'
  - '*.la'
  - /lib/libopenxr_loader.so*
  - /lib/cmake
  - /lib/girepository-1.0
  - /lib/java/core-all_classes.jar
  - /lib/java/core-junit_classes.jar
  - /lib/java/junit-runner_classes.jar
  - /lib/java/dx.jar
  - /lib/pkgconfig
  - /share/java
  - /share/doc
  - /share/gir-1.0
  - /share/man
  - /share/vala
  - /etc/ssl/certs/java/cacerts.bks
modules:
  - name: libmd
    buildsystem: autotools
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libmd-1.3.0.tar.xz
        sha256: fc0f1eb6b6766470326f2c014693809190e67dba84274a6fbae9d4912d066706
        x-checker-data:
          type: anitya
          project-id: 15525
          stable-only: true
          url-template: https://libbsd.freedesktop.org/releases/libmd-$version.tar.xz

  - name: libbsd
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libbsd-0.12.2.tar.xz
        sha256: b88cc9163d0c652aaf39a99991d974ddba1c3a9711db8f1b5838af2a14731014
        x-checker-data:
          type: anitya
          project-id: 1567
          stable-only: true
          url-template: https://libbsd.freedesktop.org/releases/libbsd-$version.tar.xz

  - name: openxr
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/KhronosGroup/OpenXR-SDK.git
        tag: release-1.1.65
        commit: 24a1f2b92d212501a2b1b8d30ffd53abf55fcfa8
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib

  - name: wolfssl
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-opensslall
      - --disable-opensslextra
      - --enable-aescbc-length-checks
      - --enable-curve25519
      - --enable-ed25519
      - --enable-ed25519-stream
      - --enable-oldtls
      - --enable-base64encode
      - --enable-tlsx
      - --enable-scrypt
      - --disable-examples
      - --enable-crl
      - --enable-jni
      - --enable-sessioncerts
    sources:
      - type: git
        url: https://github.com/wolfSSL/wolfssl.git
        tag: v5.9.4-stable
        commit: 3c5eead44904df64e6a5a1f4ebdce377d35a849a

  - name: vixl
    buildsystem: meson
    build-options:
      config-opts:
        - -Dsimulator=none
    only-arches:
      - aarch64
    sources:
      - type: archive
        url: https://github.com/Linaro/vixl/archive/refs/tags/8.0.0.tar.gz
        sha256: 6aebbebcd9b66686ea246b450af529e1fc50fe25209522cc9ab42beae2377d38
      - type: patch
        path: patches/vixl_meson_support.patch

  - name: bionic_translation
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.com/android_translation_layer/bionic_translation.git
        commit: 6253dec7f24a57a94039a088cb436d880e92e3be
        disable-submodules: true

  - name: art_standalone
    no-autogen: true
    build-options:
      make-args:
        - ____PREFIX=/app
        - ____LIBDIR=lib
      make-install-args:
        - ____PREFIX=/app
        - ____LIBDIR=lib
        - ____INSTALL_ETC=/app/etc
      env:
        LIBRARY_PATH: /app/lib
    sources:
      - type: git
        url: https://gitlab.com/android_translation_layer/art_standalone.git
        commit: 7ead96be8423b3789457b920336149f3f35a61d0

  # Build-time-only jar dependency for ATL jni_upcall_gen tool
  - name: asm
    buildsystem: simple
    build-commands:
      - javac --release 11 -d classes $(find src -name '*.java')
      - jar cf asm.jar -C classes .
      - install -Dm644 asm.jar /app/share/java/asm.jar
    sources:
      - type: archive
        url: https://repo1.maven.org/maven2/org/ow2/asm/asm/9.11.1/asm-9.11.1-sources.jar
        sha256: 3cfc56ad047260d8ccff50cd55af8922a9c9e2b0439c6eba801dbfaf0870a3ae
        archive-type: zip
        strip-components: 0
        dest: src

  # Build-time-only jar dependency for ATL jni_upcall_gen tool
  - name: asm-tree
    buildsystem: simple
    build-commands:
      - javac --release 11 -cp /app/share/java/asm.jar -d classes $(find src -name '*.java')
      - jar cf asm-tree.jar -C classes .
      - install -Dm644 asm-tree.jar /app/share/java/asm-tree.jar
    sources:
      - type: archive
        url: https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.11.1/asm-tree-9.11.1-sources.jar
        sha256: 203604136ea5f116a261aa10a415d25a8e74897749c128e532853ec4a748c572
        archive-type: zip
        strip-components: 0
        dest: src

  # Build-time-only jar dependency for ATL jni_upcall_gen tool
  - name: java-getopt
    buildsystem: simple
    build-commands:
      - javac --release 11 -d classes src/gnu/getopt/Getopt.java src/gnu/getopt/LongOpt.java
      - cp src/gnu/getopt/MessagesBundle*.properties classes/gnu/getopt/
      - jar cf java-getopt.jar -C classes .
      - install -Dm644 java-getopt.jar /app/share/java/java-getopt.jar
    sources:
      - type: archive
        url: https://repo1.maven.org/maven2/gnu/getopt/java-getopt/1.0.13/java-getopt-1.0.13-sources.jar
        sha256: 0728c551077cbb0c4e721b95915c732642d70eef24b29ac7de549983e4f1818b
        archive-type: zip
        strip-components: 0
        dest: src

  - name: android-translation-layer
    buildsystem: meson
    config-opts:
      - -Dasm_jar_path=/app/share/java/asm.jar
      - -Dasm_tree_jar_path=/app/share/java/asm-tree.jar
      - -Dgetopt_jar_path=/app/share/java/java-getopt.jar
    sources:
      - type: git
        url: https://gitlab.com/android_translation_layer/android_translation_layer.git
        commit: bbb4d469405cdaea585475b17daef13202bc7e23
      - type: patch
        path: patches/android_translation_layer_appid.patch

  - name: cacerts
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/java_home/lib/security
      - install -D /usr/lib/sdk/openjdk17/jvm/openjdk-17/lib/security/cacerts /app/share/ssl/certs/java/cacerts

  - name: libopensles-standalone
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.com/android_translation_layer/libopensles-standalone
        commit: c6982620c7dadeb90220b23c575b25eeffda765f

  - name: run-dex2oat
    buildsystem: simple
    build-options:
      append-ld-library-path: /app/lib/art:/app/lib
      arch:
        x86_64:
          env:
            arch: x86_64
        aarch64:
          env:
            arch: arm64
    build-commands:
      - mkdir -p /app/lib/java/dex/art/oat/$arch
      - dex2oat -j1 --image=/app/lib/java/dex/art/oat/$arch/boot.art --dex-file=/app/lib/java/dex/art/core-oj-hostdex.jar
        --dex-location=/app/lib/java/dex/art/core-oj-hostdex.jar --dex-file=/app/lib/java/dex/art/apachehttp-hostdex.jar
        --dex-location=/app/lib/java/dex/art/apachehttp-hostdex.jar --dex-file=/app/lib/java/dex/art/apache-xml-hostdex.jar
        --dex-location=/app/lib/java/dex/art/apache-xml-hostdex.jar --dex-file=/app/lib/java/dex/art/bouncycastle-hostdex.jar
        --dex-location=/app/lib/java/dex/art/bouncycastle-hostdex.jar --dex-file=/app/lib/java/dex/art/core-junit-hostdex.jar
        --dex-location=/app/lib/java/dex/art/core-junit-hostdex.jar --dex-file=/app/lib/java/dex/art/core-libart-hostdex.jar
        --dex-location=/app/lib/java/dex/art/core-libart-hostdex.jar --dex-file=/app/lib/java/dex/art/hamcrest-hostdex.jar
        --dex-location=/app/lib/java/dex/art/hamcrest-hostdex.jar --dex-file=/app/lib/java/dex/art/junit-runner-hostdex.jar
        --dex-location=/app/lib/java/dex/art/junit-runner-hostdex.jar --dex-file=/app/lib/java/dex/art/okhttp-hostdex.jar
        --dex-location=/app/lib/java/dex/art/okhttp-hostdex.jar --dex-file=/app/lib/java/dex/art/wolfssljni-hostdex.jar
        --dex-location=/app/lib/java/dex/art/wolfssljni-hostdex.jar --oat-file=/app/lib/java/dex/art/oat/$arch/boot.oat
        --base=0x60cf8000 --host
      # mark it as executable, so that flatpak builder extracts debug info automatically
      - chmod +x /app/lib/java/dex/art/oat/$arch/*.oat
      - mkdir -p /app/lib/java/dex/android_translation_layer/oat/$arch
      - dex2oat --dex-file=/app/lib/java/dex/android_translation_layer/api-impl.jar
        --oat-file=/app/lib/java/dex/android_translation_layer/oat/$arch/api-impl.odex
        --host
      # mark it as executable, so that flatpak builder extracts debug info automatically
      - chmod +x /app/lib/java/dex/android_translation_layer/oat/$arch/*.odex

  - name: strip-jars
    buildsystem: simple
    build-commands:
      - for f in /app/lib/java/dex/art/*.jar /app/lib/java/dex/android_translation_layer/*.jar;
        do echo stripping $f; mv $f tmp.jar; zip -d tmp.jar "classes*.dex"; mv tmp.jar
        $f; done
